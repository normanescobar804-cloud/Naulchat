<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Main Chat Bubble -->
  <path d="M120 150 C120 110, 150 80, 200 80 L320 80 C370 80, 400 110, 400 150 L400 270 C400 310, 370 340, 320 340 L230 340 L160 395 C150 403, 135 395, 135 380 L135 340 C125 335, 120 320, 120 270 Z" 
        fill="url(#bubbleGrad)" filter="url(#glow)" />

  <!-- Inner Secure Lock / Shield Motif -->
  <circle cx="260" cy="185" r="32" fill="#ffffff" opacity="0.95" />
  <rect x="235" y="210" width="50" height="42" rx="8" fill="#ffffff" opacity="0.95" />
  
  <!-- Wave sound / chat dots -->
  <circle cx="325" cy="231" r="6" fill="#ffffff" opacity="0.8" />
  <circle cx="345" cy="231" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="195" cy="231" r="6" fill="#ffffff" opacity="0.8" />
  <circle cx="175" cy="231" r="6" fill="#ffffff" opacity="0.6" />

  <!-- Subtle Nicaraguan Flag Accent Strip -->
  <g transform="translate(196, 285)">
    <rect x="0" y="0" width="128" height="4" rx="2" fill="#38bdf8" />
    <rect x="0" y="6" width="128" height="4" rx="2" fill="#ffffff" />
    <rect x="0" y="12" width="128" height="4" rx="2" fill="#38bdf8" />
  </g>
</svg>
